name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # `bun publish` has no OIDC support (oven-sh/bun#22423, #24855) —
      # `changeset publish` uses npm internally, so it works fine with trusted publishing.
      # Run from /tmp to avoid EBADDEVENGINES (root package.json requires bun).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      # `vp check` typechecks `site/` too, and Next's route types (`LayoutProps`,
      # `PageProps`) only exist once typegen has run — a fresh checkout has no
      # `.next`, so generate them first, exactly as CI's `check-site` job does.
      - name: Generate Next route types
        working-directory: site
        run: bunx next typegen

      - name: Check (format, lint, typecheck)
        run: bunx vp check

      - name: Validate registry schema
        working-directory: site
        run: bunx --bun shadcn build

      # changeset publish runs from /tmp so npm is not blocked by devEngines.
      # OIDC (id-token: write) handles auth — no NPM_TOKEN needed.
      - name: Publish packages
        run: |
          cp -r . /tmp/slash-editor
          cd /tmp && bunx changeset publish --filter=@slash-editor/*
        working-directory: /tmp/slash-editor
