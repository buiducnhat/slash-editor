name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # `bun publish` has no OIDC support (oven-sh/bun#22423, #24855) — the
      # registry upload runs through real npm instead. Trusted publishing needs
      # npm >= 11.5.1, so put a recent Node on PATH and pin that floor rather
      # than trust whatever the runner image bundles.
      - name: Set up Node (npm publish supports OIDC; bun publish does not)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      # `vp check` typechecks `site/` too, and Next's route types (`LayoutProps`,
      # `PageProps`) only exist once typegen has run — a fresh checkout has no
      # `.next`, so generate them first, exactly as CI's `check-site` job does.
      - name: Generate Next route types
        working-directory: site
        run: bunx next typegen

      - name: Check (format, lint, typecheck)
        run: bunx vp check

      - name: Validate registry schema
        working-directory: site
        run: bunx --bun shadcn build

      # The version bump is committed ahead of the tag (`changeset version`), so
      # these steps only upload what the tag already says. Two constraints shape
      # them:
      #
      # - `npm pack` leaves `workspace:*` in react's manifest (`npm pack` in
      #   packages/react ships `@slash-editor/core: "workspace:*"`, which no
      #   consumer can resolve), while `bun pm pack` resolves it to the concrete
      #   version — so pack with bun and upload the tarball with npm;
      # - npm refuses to run anywhere inside this tree: the root `devEngines`
      #   pins bun, and devEngines resolves against the workspace root rather
      #   than cwd (EBADDEVENGINES), so publish from /tmp, where no package.json
      #   governs it.
      - name: Pack @slash-editor/core
        working-directory: packages/core
        run: bun pm pack --destination /tmp/pack/core

      - name: Publish @slash-editor/core
        working-directory: /tmp
        run: npm publish /tmp/pack/core/*.tgz --access public --ignore-scripts

      - name: Pack @slash-editor/react
        working-directory: packages/react
        run: bun pm pack --destination /tmp/pack/react

      - name: Publish @slash-editor/react
        working-directory: /tmp
        run: npm publish /tmp/pack/react/*.tgz --access public --ignore-scripts
